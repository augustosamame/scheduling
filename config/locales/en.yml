    # Email notifications
    mailers:
      confirmation:
        subject: "Appointment Confirmation - %{event_type}"
        greeting: "Hi %{client_name},"
        confirmed: "Your appointment has been confirmed"
        details: "Appointment details:"
        date: "Date"
        time: "Time"
        duration: "Duration"
        with: "With"
        location: "Location"
        cancel_link: "Cancel appointment"
        reschedule_link: "Reschedule appointment"
      reminder:
        subject: "Appointment Reminder - %{event_type}"
        reminder: "This is a reminder of your upcoming appointment"
        tomorrow: "tomorrow"
        today: "today"
      cancellation:
        subject: "Appointment Cancelled - %{event_type}"
        cancelled: "Your appointment has been cancelled"
        refund: "If you made a payment, you will receive a refund in 5-10 business days"
      reschedule:
        subject: "Appointment Rescheduled - %{event_type}"
        rescheduled: "Your appointment has been rescheduled"
        new_time: "New date and time:"

    # Time
    time:
      formats:
        booking: "%A, %B %d at %I:%M %p"
        short_date: "%m/%d/%Y"
        short_time: "%I:%M %p"

  notifications:
    sms:
      confirmation: "Hello %{client_name}! Your appointment with %{member_name} for %{event_type} is confirmed for %{date} at %{time}. Location: %{location}. Cancel: %{cancel_url}"
      cancellation: "Hello %{client_name}, your appointment with %{member_name} for %{event_type} has been cancelled."
      reschedule: "Hello %{client_name}, your appointment with %{member_name} has been rescheduled to %{date} at %{time}."
      reminder: "Reminder: Your appointment with %{member_name} for %{event_type} is on %{date} at %{time}. Location: %{location}"
